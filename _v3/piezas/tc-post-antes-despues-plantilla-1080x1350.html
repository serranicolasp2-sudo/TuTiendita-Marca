<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post de antes y después</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..800&family=Reenie+Beanie&display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 84px; background: #1A1712; color: #FFFAEB; font-family: Figtree, 'Segoe UI', sans-serif; display: flex; flex-direction: column; gap: 52px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Arial Narrow', sans-serif; font-size: 112px; font-weight: 800; letter-spacing: -0.03em; line-height: 0.98; color: #FFD23F">Esa foto de siempre, como nueva.</h1>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; flex-grow: 1">
<div style="position: relative; background: #C9BFB4; border-radius: 6px; display: flex; align-items: center; justify-content: center; text-align: center; color: #1A1712; font-size: 30px; padding: 32px">
[foto original del cliente]
<span style="position: absolute; left: 20px; bottom: 20px; background: #FFFAEB; color: #1A1712; font-family: 'Bricolage Grotesque', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1; padding: 11px 16px; border-radius: 6px">Antes</span>
<span style="position: absolute; left: -16px; top: -16px; border-left: 14px solid #D7301F; border-top: 14px solid #D7301F; width: 64px; height: 64px"></span>
</div>
<div style="position: relative; background: #C9BFB4; border-radius: 6px; display: flex; align-items: center; justify-content: center; text-align: center; color: #1A1712; font-size: 30px; padding: 32px">
[foto restaurada]
<span style="position: absolute; left: 20px; bottom: 20px; background: #FFD23F; color: #1A1712; font-family: 'Bricolage Grotesque', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1; padding: 11px 16px; border-radius: 6px">Después</span>
<span style="position: absolute; right: -16px; bottom: -16px; border-right: 14px solid #D7301F; border-bottom: 14px solid #D7301F; width: 64px; height: 64px"></span>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 34px; line-height: 1.25; white-space: nowrap">
<span style="font-weight: 700">Foto restaurada $6.500</span>
<span>@tucancion.com.ar</span>
</div>
<img src="../assets/logos/tc-logo-fotos-yema.svg" alt="Tu Canción, Restauración de fotos" style="height: 104px; width: auto; flex: none">
</div>
</div>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post de antes y después</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 84px; background: #1A1712; color: #FFFAEB; font-family: Archivo, 'Arial Narrow', sans-serif; display: flex; flex-direction: column; gap: 48px">
<h1 style="margin: 0; font-size: 88px; font-weight: 900; font-stretch: 125%; letter-spacing: -0.03em; line-height: 1.02; color: #FFD23F">Esa foto de siempre, como nueva.</h1>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; flex-grow: 1">
<div style="position: relative; background: #C9BFB4; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; color: #1A1712; font-size: 30px; padding: 32px">
[foto original del cliente]
<span style="position: absolute; left: 20px; bottom: 20px; background: #FFFAEB; color: #1A1712; font-weight: 800; font-stretch: 125%; font-size: 28px; padding: 10px 16px; border-radius: 6px">Antes</span>
</div>
<div style="position: relative; background: #C9BFB4; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; color: #1A1712; font-size: 30px; padding: 32px">
[foto restaurada]
<span style="position: absolute; left: 20px; bottom: 20px; background: #FFD23F; color: #1A1712; font-weight: 800; font-stretch: 125%; font-size: 28px; padding: 10px 16px; border-radius: 6px">Después</span>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 34px; line-height: 1.25; white-space: nowrap">
<span style="font-weight: 700">Foto restaurada $6.500</span>
<span>@tucancion.com.ar</span>
</div>
<img src="../assets/logos/tc-logo-yema.svg" alt="Tu Canción" style="height: 50px; width: auto; flex: none">
</div>
</div>
</body>
</html>

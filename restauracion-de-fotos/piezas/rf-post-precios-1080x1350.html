<!doctype html>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Arial Narrow', sans-serif; font-size: 104px; font-weight: 800; letter-spacing: -0.03em; line-height: 0.98; color: #1A1712">Cuánto sale restaurar una foto</h1>

<span style="font-family: 'Bricolage Grotesque', 'Arial Narrow', sans-serif; font-size: 68px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; color: #1A1712">$6.500</span>

</div>
<span style="font-family: 'Bricolage Grotesque', 'Arial Narrow', sans-serif; font-size: 68px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; color: #1A1712">$15.900</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 32px 0">

</div>
<span style="font-family: 'Bricolage Grotesque', 'Arial Narrow', sans-serif; font-size: 68px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; color: #D7301F">$59.900</span>

</div>
<p style="margin: 0; font-size: 42px; line-height: 1.25; font-weight: 500">Color incluido y una corrección antes de la entrega.</p>

<div style="display: flex; flex-direction: column; gap: 6px; font-size: 34px; line-height: 1.25; white-space: nowrap">
